    transform = 'translate3d(' + (s * 130) + '%, 0, -' + Math.round(depthUnit * 3) + 'px) scale(.9)'; opacity = 0; zIndex = 10; boxShadow = 'none';
  }
  return `position:absolute; left:50%; top:50%; width:${w}px; height:${h}px; margin-left:-${w / 2}px; margin-top:-${h / 2}px; transform-style:preserve-3d; cursor:pointer; transition:transform 1s cubic-bezier(.16,1,.3,1), opacity .9s cubic-bezier(.16,1,.3,1), filter .9s ease, box-shadow .9s ease; transform:${transform}; opacity:${opacity}; filter:${filter}; z-index:${zIndex}; box-shadow:${boxShadow};`;
}

      entries.forEach((e) => {
        processInView = e.isIntersecting;
        activateStepVideo();
      });
    }, { threshold: 0.15 });
    io.observe(processSection);
  }

  const servicePanels = document.querySelectorAll('.service-panel');
  if (servicePanels.length) {
    const panelIo = new IntersectionObserver((entries) => {
      entries.forEach((e) => {

/* Hero particle field */
(function () {
  const cv = fieldCanvas;
  const ctx = cv.getContext('2d');
  if (!ctx) return;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const opaqueEls = ['about', 'contact'].map((id) => document.getElementById(id)).filter(Boolean);
  const field = { w: 0, h: 0, pts: [], mx: 0, my: 0, tx: 0, ty: 0, t: 0, blobs: [] };

  function seed() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    field.w = Math.max(1, window.innerWidth); field.h = Math.max(1, window.innerHeight);
    cv.width = Math.round(field.w * dpr); cv.height = Math.round(field.h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const dens = 1.2;
    const cap = field.w < 640 ? 55 : 110;
    const n = Math.max(28, Math.min(cap, Math.round((field.w * field.h) / 11000 * dens)));
    field.pts = new Array(n).fill(0).map(() => {
      const hub = Math.random() < .12;
      return {
        x: Math.random() * field.w, y: Math.random() * field.h,
        vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .24,
        r: hub ? 2.2 + Math.random() * 1.6 : .8 + Math.random() * 1.3,
        a: hub ? .55 + Math.random() * .35 : .2 + Math.random() * .4,
        d: .4 + Math.random() * 1.5, hub: hub, near: 0
      };
    });
    field.blobs = [
      { x: .22, y: .3, r: .55, a: .13, sx: .00007, sy: .00005, p: 0 },
      { x: .78, y: .22, r: .48, a: .11, sx: -.00006, sy: .00008, p: 2 },
      { x: .55, y: .82, r: .6, a: .09, sx: .00005, sy: -.00006, p: 4 }
    ];
    field.t = 0;
  }

  function draw(move) {
    const prog = Math.min(1, (window.scrollY || 0) / Math.max(1, window.innerHeight));
    const ease = prog * prog * (3 - 2 * prog);
    const motion = 1 - .6 * ease;
    const heroF = 1 - ease;
    cv.style.opacity = (1 - .75 * ease).toFixed(3);
    ctx.clearRect(0, 0, field.w, field.h);
    if (move) field.t += motion;
    field.mx += (field.tx - field.mx) * .05;
    field.my += (field.ty - field.my) * .05;

    for (let b = 0; b < field.blobs.length; b++) {
      const bl = field.blobs[b];
      const cx = (bl.x + Math.sin(field.t * bl.sx * 12 + bl.p) * .07) * field.w + field.mx * 34;
      const cy = (bl.y + Math.cos(field.t * bl.sy * 12 + bl.p) * .06) * field.h + field.my * 22;
      const rad = bl.r * Math.max(field.w, field.h) * .62;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rad);
      g.addColorStop(0, 'rgba(201,247,197,' + bl.a + ')');
      g.addColorStop(.45, 'rgba(201,247,197,' + (bl.a * .28).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(201,247,197,0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, field.w, field.h);
    }

    const pts = field.pts;
    const ptrX = (field.tx * .5 + .5) * field.w, ptrY = (field.ty * .5 + .5) * field.h;
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      if (move) {
        p.x += p.vx * motion; p.y += p.vy * motion;
        if (p.x < -20) p.x = field.w + 20; else if (p.x > field.w + 20) p.x = -20;
        if (p.y < -20) p.y = field.h + 20; else if (p.y > field.h + 20) p.y = -20;
      }
      p.px = p.x + field.mx * p.d * 30;
      p.py = p.y + field.my * p.d * 20;
      const ddx = p.px - ptrX, ddy = p.py - ptrY;
      p.near = heroF * Math.max(0, 1 - Math.sqrt(ddx * ddx + ddy * ddy) / 320);
    }

    pts.sort((a2, b2) => a2.px - b2.px);
    ctx.lineWidth = 1;
    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[j].px - pts[i].px;
        if (dx > 170) break;
        const dy = pts[i].py - pts[j].py;
        const d2 = dx * dx + dy * dy;
        if (d2 < 28900) {
          const tt = 1 - Math.sqrt(d2) / 170;
          const boost = 1 + 2.6 * Math.max(pts[i].near, pts[j].near);
          ctx.strokeStyle = 'rgba(201,247,197,' + Math.min(.5, .13 * tt * boost).toFixed(3) + ')';
          ctx.beginPath(); ctx.moveTo(pts[i].px, pts[i].py); ctx.lineTo(pts[j].px, pts[j].py); ctx.stroke();
        }
      }
    }

    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const a = Math.min(1, p.a * (1 + 1.1 * p.near));
      if (p.hub) {
        const gr = p.r * 7 + 10 * p.near;
        const hg = ctx.createRadialGradient(p.px, p.py, 0, p.px, p.py, gr);
        hg.addColorStop(0, 'rgba(201,247,197,' + (.34 + .3 * p.near).toFixed(3) + ')');
        hg.addColorStop(1, 'rgba(201,247,197,0)');
        ctx.fillStyle = hg;
        ctx.beginPath(); ctx.arc(p.px, p.py, gr, 0, 6.2832); ctx.fill();
        ctx.strokeStyle = 'rgba(201,247,197,' + (.16 + .3 * p.near).toFixed(3) + ')';
        ctx.beginPath(); ctx.arc(p.px, p.py, p.r * 4.5 + 6 * p.near, 0, 6.2832); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(201,247,197,' + a.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(p.px, p.py, p.r * (1 + .5 * p.near), 0, 6.2832); ctx.fill();
    }
  }

  function start() {
    seed();
    draw(false);
    if (reduced) return;

    window.addEventListener('pointermove', (e) => {
      field.tx = (e.clientX / window.innerWidth - .5) * 2;
      field.ty = (e.clientY / window.innerHeight - .5) * 2;
    }, { passive: true });

    window.addEventListener('resize', () => { seed(); draw(false); }, { passive: true });

    function covers() {
      const vh = window.innerHeight;
      for (let i = 0; i < opaqueEls.length; i++) {
        const r = opaqueEls[i].getBoundingClientRect();
        if (r.top <= 0 && r.bottom >= vh) return true;
      }
      return false;
    }
    let n = 0, live = true;
    function loop() {
      if ((n++ & 7) === 0) live = document.visibilityState !== 'hidden' && !covers();
      if (live) draw(true);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  }

  if ('requestIdleCallback' in window) requestIdleCallback(start, { timeout: 1200 });
  else setTimeout(start, 200);
})();

/* Hero background video: deferred start, viewport-gated, reduced-motion safe */
(function () {
  const heroVideo = document.getElementById('heroVideo');
  const heroPosterImg = document.getElementById('heroPoster');
  const heroSection = document.getElementById('top');
  if (!heroVideo || !heroSection) return;
  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced || mobileMq.matches) return;

  let started = false;
  function startHeroVideo() {
    if (started) return;
    started = true;
    const source = heroVideo.querySelector('source');
    if (source && source.dataset.src) source.src = source.dataset.src;
    heroVideo.load();
    heroVideo.play().then(() => {
      heroVideo.style.opacity = '1';
      if (heroPosterImg) heroPosterImg.style.opacity = '0';
    }).catch(() => {});
  }

  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          if (!started) {
            if ('requestIdleCallback' in window) requestIdleCallback(startHeroVideo, { timeout: 1500 });
            else setTimeout(startHeroVideo, 300);
          } else {
            heroVideo.play().catch(() => {});
          }
        } else if (started) {
          heroVideo.pause();
        }
      });
    }, { threshold: 0.1 });
    io.observe(heroSection);
  } else if ('requestIdleCallback' in window) {
    requestIdleCallback(startHeroVideo, { timeout: 1500 });
  } else {
    setTimeout(startHeroVideo, 300);
  }
})();

let resizeTimer;
function scheduleCardsResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(renderCards, 150);
}
window.addEventListener('resize', scheduleCardsResize);
function resetViewportZoom() {
  const vp = document.querySelector('meta[name="viewport"]');
  if (!vp) return;
  const original = vp.getAttribute('content');
  vp.setAttribute('content', original + ', maximum-scale=1');
  requestAnimationFrame(() => vp.setAttribute('content', original));
}

window.addEventListener('orientationchange', () => {
  renderCards();
  resetViewportZoom();
  setTimeout(() => { renderCards(); resetViewportZoom(); }, 100);
  setTimeout(() => { renderCards(); resetViewportZoom(); }, 400);
});

render();
renderSteps();
updateSpine();
requestAnimationFrame(armReveals);
</script>
</body>
