<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #08080a; }
  * { box-sizing: border-box; }
  a { color: #e6c9a3; text-decoration: none; }
  a:hover { color: #ffffff; }
  @keyframes omRise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes omWord { from { opacity: 0; transform: translateY(108%); } to { opacity: 1; transform: translateY(0); } }
  @keyframes omStage { from { opacity: 0; transform: translateY(64px) scale(.95); } to { opacity: 1; transform: none; } }
  @keyframes omSheen { 0% { transform: translateX(-140%) skewX(-16deg); } 60%, 100% { transform: translateX(320%) skewX(-16deg); } }
  @keyframes omKen { from { transform: scale(1.01); } to { transform: scale(1.11); } }
  @keyframes omGlow { from { transform: translate3d(-3%, 0, 0) scale(1); } to { transform: translate3d(5%, 3%, 0) scale(1.18); } }
  @keyframes omBlink { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
</style>
</helmet>
<div style="position: relative; min-height: 100vh; width: 100%; overflow: hidden; background: #08080a; font-family: 'Instrument Sans', Helvetica, sans-serif; color: #f4f3f1; padding: 84px 0 96px; display: flex; flex-direction: column; align-items: center;">

  <div style="position: absolute; inset: -20% 10% 30% -10%; pointer-events: none; background: radial-gradient(45% 45% at 30% 40%, rgba(224,178,135,.10), transparent 70%); filter: blur(40px); animation: omGlow 22s ease-in-out infinite alternate;"></div>
  <div style="position: absolute; inset: 20% -15% -25% 30%; pointer-events: none; background: radial-gradient(40% 40% at 60% 50%, rgba(120,140,190,.09), transparent 70%); filter: blur(50px); animation: omGlow 28s ease-in-out infinite alternate-reverse;"></div>
  <div style="position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 80% at 50% 0%, rgba(255,255,255,.045), transparent 60%);"></div>

  <header style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; padding: 0 32px; max-width: 780px;">
    <div style="display: inline-flex; align-items: center; gap: 9px; padding: 7px 15px 7px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.10); background: rgba(255,255,255,.045); backdrop-filter: blur(12px); font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #d5d2cc; animation: omRise .8s cubic-bezier(.16,1,.3,1) .05s both;">
      <span style="width: 6px; height: 6px; border-radius: 50%; background: #e0b287; animation: omBlink 2.6s ease-in-out infinite;"></span>
      Our Work
    </div>

    <h1 style="margin: 0; font-size: 62px; line-height: 1.02; font-weight: 600; letter-spacing: -.035em; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 .28em;">
      <span style="display: inline-block; overflow: hidden; padding-bottom: .08em;"><span style="display: inline-block; animation: omWord 1s cubic-bezier(.16,1,.3,1) .12s both;">Work</span></span>
      <span style="display: inline-block; overflow: hidden; padding-bottom: .08em;"><span style="display: inline-block; animation: omWord 1s cubic-bezier(.16,1,.3,1) .20s both;">We're</span></span>
      <span style="display: inline-block; overflow: hidden; padding-bottom: .08em;"><span style="display: inline-block; animation: omWord 1s cubic-bezier(.16,1,.3,1) .28s both;">Proud</span></span>
      <span style="display: inline-block; overflow: hidden; padding-bottom: .08em;"><span style="display: inline-block; animation: omWord 1s cubic-bezier(.16,1,.3,1) .36s both; color: #c9c5be;">Of</span></span>
    </h1>

    <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #9b978f; max-width: 520px; text-wrap: pretty; animation: omRise .9s cubic-bezier(.16,1,.3,1) .42s both;">A selection of projects we've crafted for clients across industries.</p>
  </header>

  <div style="position: relative; width: 100%; margin-top: 56px; animation: omStage 1.2s cubic-bezier(.16,1,.3,1) .5s both;">
    <div onMouseEnter="{{ onEnter }}" onMouseLeave="{{ onLeave }}" onMouseMove="{{ onMove }}" style="position: relative; width: 100%; height: 470px; perspective: 1700px; perspective-origin: 50% 45%;">
      <div style="{{ tiltStyle }}">
        <sc-for list="{{ cards }}" as="card" hint-placeholder-count="3">
          <div onClick="{{ card.onClick }}" style="{{ card.style }}">
            <div style="position: absolute; inset: 0; border-radius: 26px; overflow: hidden; background: #131315;">
              <sc-if value="{{ card.src }}">
                <img src="{{ card.src }}" alt="{{ card.title }}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; animation: omKen 24s ease-in-out infinite alternate;">
              </sc-if>
              <sc-if value="{{ card.empty }}">
                <div style="position: absolute; inset: 0;">
                  <image-slot id="{{ card.slotId }}" shape="rect" placeholder="{{ card.slotHint }}"></image-slot>
                </div>
              </sc-if>
              <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(6,6,8,.78) 0%, rgba(6,6,8,.18) 42%, rgba(6,6,8,0) 70%); pointer-events: none;"></div>
              <div style="{{ card.sheenStyle }}">
                <div style="position: absolute; top: -30%; left: 0; width: 22%; height: 160%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.16), rgba(255,255,255,0)); animation: omSheen 7s cubic-bezier(.5,0,.3,1) infinite 1.4s;"></div>
              </div>
            </div>

            <div style="{{ card.captionStyle }}">
              <div style="display: flex; flex-direction: column; gap: 5px; min-width: 0;">
                <div style="font-size: 21px; font-weight: 600; letter-spacing: -.02em; color: #fbfaf8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ card.title }}</div>
                <div style="font-size: 14px; color: #a9a49c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ card.sub }}</div>
              </div>
              <div style="flex: none; width: 52px; height: 52px; border-radius: 50%; background: #f6f4f1; color: #121212; display: flex; align-items: center; justify-content: center; font-size: 19px; transition: transform .45s cubic-bezier(.16,1,.3,1), background .3s;" style-hover="transform: rotate(45deg) scale(1.06); background: #ffffff;">↗</div>
            </div>

            <div style="{{ card.veilStyle }}"></div>
          </div>
        </sc-for>
      </div>

      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 14%; pointer-events: none; background: linear-gradient(90deg, #08080a 8%, rgba(8,8,10,0));"></div>
      <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 14%; pointer-events: none; background: linear-gradient(270deg, #08080a 8%, rgba(8,8,10,0));"></div>

      <button onClick="{{ prev }}" aria-label="Previous project" style="position: absolute; left: 5%; top: 50%; margin-top: -24px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); background: rgba(20,20,22,.62); backdrop-filter: blur(14px); color: #efece7; font-size: 20px; cursor: pointer; z-index: 60; display: flex; align-items: center; justify-content: center; transition: background .3s, transform .3s cubic-bezier(.16,1,.3,1), border-color .3s, color .3s;" style-hover="background: rgba(246,244,241,.94); color: #131313; transform: scale(1.08); border-color: rgba(255,255,255,.4);">‹</button>
      <button onClick="{{ next }}" aria-label="Next project" style="position: absolute; right: 5%; top: 50%; margin-top: -24px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); background: rgba(20,20,22,.62); backdrop-filter: blur(14px); color: #efece7; font-size: 20px; cursor: pointer; z-index: 60; display: flex; align-items: center; justify-content: center; transition: background .3s, transform .3s cubic-bezier(.16,1,.3,1), border-color .3s, color .3s;" style-hover="background: rgba(246,244,241,.94); color: #131313; transform: scale(1.08); border-color: rgba(255,255,255,.4);">›</button>
    </div>
  </div>

  <div style="position: relative; margin-top: 46px; display: flex; align-items: center; gap: 26px; animation: omRise 1s cubic-bezier(.16,1,.3,1) .8s both;">
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: .12em; color: #6f6b65;"><span style="color: #f2efe9;">{{ counter }}</span> / {{ total }}</div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <sc-for list="{{ dots }}" as="dot" hint-placeholder-count="4">
        <button onClick="{{ dot.onClick }}" aria-label="{{ dot.label }}" style="{{ dot.style }}">
          <span style="{{ dot.fillStyle }}"></span>
        </button>
      </sc-for>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #57544f;">{{ statusLabel }}</div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#e0b287&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#e0b287&quot;,&quot;#8fb6e0&quot;,&quot;#cfcac2&quot;,&quot;#9ee0c4&quot;]},&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;intervalSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:5.5,&quot;min&quot;:2,&quot;max&quot;:12,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { index: 0, progress: 0, hover: false, mx: 0, my: 0 };

  items = [
    { title: "Kinetic Studios", sub: "Motion graphics & visual effects", src: "assets/project-kinetic.png" },
    { title: "Vitality Wellness", sub: "Health & wellbeing platform", slotId: "proj-vitality", slotHint: "Drop project shot — Vitality Wellness" },
    { title: "Northline Atelier", sub: "Brand identity & art direction", slotId: "proj-northline", slotHint: "Drop project shot — Northline Atelier" },
    { title: "Cadence Labs", sub: "Product design & engineering", slotId: "proj-cadence", slotHint: "Drop project shot — Cadence Labs" }
  ];

  componentDidMount() {
    this.timer = setInterval(() => this.tick(), 50);
    this.onKey = (e) => {
      if (e.key === "ArrowRight") this.go(1);
      if (e.key === "ArrowLeft") this.go(-1);
    };
    window.addEventListener("keydown", this.onKey);
  }

  componentWillUnmount() {
    clearInterval(this.timer);
    window.removeEventListener("keydown", this.onKey);
  }

  tick() {
    const auto = this.props.autoplay ?? true;
    if (!auto || this.state.hover) return;
    const dur = Math.max(1.5, this.props.intervalSeconds ?? 5.5) * 1000;
    const p = this.state.progress + 50 / dur;
    if (p >= 1) this.setState({ progress: 0, index: (this.state.index + 1) % this.items.length });
    else this.setState({ progress: p });
  }

  go(d) {
    const n = this.items.length;
    this.setState({ index: (this.state.index + d + n) % n, progress: 0 });
  }

  offsetOf(i) {
    const n = this.items.length;
    let o = ((i - this.state.index) % n + n) % n;
    if (o > n / 2) o -= n;
    return o;
  }

  cardStyle(o) {
    const s = o < 0 ? -1 : 1;
    const a = Math.abs(o);
    const base = {
      position: "absolute", left: "50%", top: "50%", width: "620px", height: "412px",
      marginLeft: "-310px", marginTop: "-206px", borderRadius: "26px",
      transformStyle: "preserve-3d", cursor: a === 0 ? "default" : "pointer",
      transition: "transform 1s cubic-bezier(.16,1,.3,1), opacity .9s cubic-bezier(.16,1,.3,1), filter .9s ease, box-shadow .9s ease"
    };
    if (a === 0) return Object.assign(base, {
      transform: "translate3d(0,0,0) rotateY(0deg) scale(1)", opacity: 1, filter: "none", zIndex: 40,
      boxShadow: "0 44px 90px -30px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.07)"
    });
    if (a === 1) return Object.assign(base, {
      transform: "translate3d(" + (s * 61) + "%, 8px, -230px) rotateY(" + (-s * 19) + "deg) scale(.97)",
      opacity: .5, filter: "blur(2px)", zIndex: 30,
      boxShadow: "0 30px 60px -30px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.05)"
    });
    if (a === 2) return Object.assign(base, {
      transform: "translate3d(" + (s * 102) + "%, 14px, -460px) rotateY(" + (-s * 23) + "deg) scale(.94)",
      opacity: .16, filter: "blur(5px)", zIndex: 20, boxShadow: "none"
    });
    return Object.assign(base, { transform: "translate3d(" + (s * 130) + "%, 0, -700px) scale(.9)", opacity: 0, zIndex: 10, boxShadow: "none" });
  }

  renderVals() {
    const idx = this.state.index;
    const auto = this.props.autoplay ?? true;
    const cards = this.items.map((it, i) => {
      const o = this.offsetOf(i);
      const active = o === 0;
      return {
        title: it.title, sub: it.sub, src: it.src || "", empty: !it.src,
        slotId: it.slotId || ("slot-" + i), slotHint: it.slotHint || "Drop project shot",
        style: this.cardStyle(o),
        onClick: () => { if (!active) this.setState({ index: i, progress: 0 }); },
        sheenStyle: {
          position: "absolute", inset: 0, overflow: "hidden", pointerEvents: "none",
          opacity: active ? 1 : 0, transition: "opacity .8s ease"
        },
        captionStyle: {
          position: "absolute", left: "20px", right: "20px", bottom: "20px", height: "88px",
          display: "flex", alignItems: "center", justifyContent: "space-between", gap: "18px",
          padding: "0 16px 0 26px", borderRadius: "22px",
          background: "linear-gradient(100deg, rgba(24,24,26,.86), rgba(24,24,26,.58))",
          backdropFilter: "blur(20px)", WebkitBackdropFilter: "blur(20px)",
          border: "1px solid rgba(255,255,255,.09)",
          transform: active ? "translateY(0)" : "translateY(14px)",
          opacity: active ? 1 : 0,
          transition: "transform .9s cubic-bezier(.16,1,.3,1) .12s, opacity .7s ease"
        },
        veilStyle: {
          position: "absolute", inset: 0, borderRadius: "26px", pointerEvents: "none",
          background: "rgba(8,8,10,.55)", opacity: active ? 0 : 1, transition: "opacity .9s ease"
        }
      };
    });
    const accent = this.props.accentColor ?? "#e0b287";
    const dots = this.items.map((it, i) => ({
      label: it.title,
      onClick: () => this.setState({ index: i, progress: 0 }),
      style: {
        position: "relative", width: i === idx ? "46px" : "8px", height: "8px", padding: 0,
        borderRadius: "999px", border: "none", cursor: "pointer", overflow: "hidden",
        background: i === idx ? "rgba(255,255,255,.16)" : "rgba(255,255,255,.20)",
        transition: "width .8s cubic-bezier(.16,1,.3,1), background .4s"
      },
      fillStyle: {
        position: "absolute", left: 0, top: 0, bottom: 0, borderRadius: "999px", background: accent,
        width: i === idx ? (auto ? (this.state.progress * 100) + "%" : "100%") : "0%",
        transition: "width .12s linear"
      }
    }));
    return {
      cards, dots,
      counter: String(idx + 1).padStart(2, "0"),
      total: String(this.items.length).padStart(2, "0"),
      statusLabel: this.state.hover ? "Paused" : (auto ? "Auto" : "Manual"),
      tiltStyle: {
        position: "absolute", inset: 0, transformStyle: "preserve-3d",
        transform: "rotateY(" + (this.state.mx * 4).toFixed(2) + "deg) rotateX(" + (-this.state.my * 2.4).toFixed(2) + "deg)",
        transition: "transform .7s cubic-bezier(.22,1,.36,1)"
      },
      onEnter: () => this.setState({ hover: true }),
      onLeave: () => this.setState({ hover: false, mx: 0, my: 0 }),
      onMove: (e) => {
        const r = e.currentTarget.getBoundingClientRect();
        this.setState({ mx: (e.clientX - r.left) / r.width - .5, my: (e.clientY - r.top) / r.height - .5 });
      },
      prev: () => this.go(-1),
      next: () => this.go(1)
    };
  }
}
</script>
</body>
</html>
